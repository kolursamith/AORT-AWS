[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "aort-aws"
version = "0.1.0"
description = "Security-aware digital-twin-controlled recovery of ambiguous synthetic banking transactions"
readme = "README.md"
requires-python = ">=3.11,<3.15"
license = { text = "MIT" }
dependencies = [
  "fastapi==0.143.1",
  "httpx==0.28.1",
  "pydantic==2.12.3",
  "pydantic-settings==2.11.0",
  "sqlalchemy==2.0.44",
  "starlette==1.8.0",
  "psycopg[binary]==3.2.10",
  "uvicorn[standard]==0.38.0",
]

[project.optional-dependencies]
dev = [
  "pip-audit==2.9.0",
  "pytest==9.1.1",
  "pytest-asyncio==1.4.0",
  "ruff==0.14.2",
]
research = [
  "numpy==2.3.4",
  "pandas==2.3.3",
  "plotly==6.4.0",
  "scikit-learn==1.7.2",
  "simpy==4.1.1",
]
aws = ["boto3==1.40.58"]
dashboard = ["streamlit==1.50.0"]

[tool.hatch.build.targets.wheel]
packages = ["backend", "contracts", "intelligence"]

[tool.pytest.ini_options]
addopts = "-q --strict-markers"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S"]
ignore = ["S101"]
