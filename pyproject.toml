[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "aort-aws"
version = "0.1.0"
description = "Security-aware digital-twin-controlled recovery of ambiguous synthetic banking transactions"
readme = "README.md"
requires-python = ">=3.11,<3.15"
license = { text = "MIT" }
dependencies = [
  "fastapi==0.143.1",
  "httpx==0.28.1",
  "pydantic==2.12.3",
  "pydantic-settings==2.11.0",
  "sqlalchemy==2.0.44",
  "starlette==1.8.0",
  "psycopg[binary]==3.2.10",
  "uvicorn[standard]==0.38.0",
  "alembic==1.20.0",  # Track B ledger migrations (backend/aorts/banking/ledger/migrations)
]

[project.optional-dependencies]
dev = [
  "pip-audit==2.9.0",
  "pytest==9.1.1",
  "pytest-asyncio==1.4.0",
  "ruff==0.14.2",
]
research = [
  "numpy==2.3.4",
  "pandas==2.3.3",
  "plotly==6.4.0",
  "scikit-learn==1.7.2",
  "simpy==4.1.1",
]
aws = ["boto3==1.40.58"]
dashboard = [
  "streamlit==1.66.1",
  "pillow==13.0.0",  # pinned past known CVEs (streamlit 1.66.1 allows <14)
  "plotly==6.4.0",  # backend/aorts/dashboard/app.py
  "pandas==2.3.3",
]

[tool.hatch.build.targets.wheel]
packages = ["backend", "contracts", "intelligence"]

[tool.pytest.ini_options]
addopts = "-q --strict-markers"
testpaths = ["tests"]
markers = ["slow: longer-running Track B concurrency / load tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S"]
ignore = ["S101"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI dependency markers are evaluated per request, not shared mutable defaults (standard idiom).
extend-immutable-calls = [
  "fastapi.Depends", "fastapi.Query", "fastapi.Header", "fastapi.Body",
  # Track B dependency factories: return a per-request dependency callable, hold no mutable state.
  "backend.aorts.app.dependencies.require_roles", "backend.aorts.app.dependencies.require_flag",
]

[tool.ruff.lint.per-file-ignores]
# Track B: long SQL / log / message strings that the formatter cannot split (code is ruff-formatted).
"backend/aorts/**" = ["E501", "S311"]  # S311: random is only for SEEDED simulation & jitter; secrets use `secrets`
"tests/trackb/**" = ["E501", "S311"]
"infra/trackb/**" = ["E501", "S311", "S104", "S108"]  # S104/S108: bind/tmp inside private ECS task containers
