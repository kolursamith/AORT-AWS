name: CI

# Runs on every pull request into the protected branches, and on pushes to
# them (so a merged result is validated too).
on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

# A newer push to the same PR cancels the previous run.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------
  # Static checks. Deliberately dependency-light and deterministic: these
  # catch real breakage (syntax errors, undefined names, invalid YAML)
  # rather than enforcing a style opinion the team has not agreed on.
  # ---------------------------------------------------------------------
  static-checks:
    name: Static checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install checkers
        run: python -m pip install --quiet pyflakes

      - name: Python syntax (compileall)
        run: |
          # Excludes virtualenvs, which are never committed but may exist
          # in a local checkout.
          python -m compileall -q \
            -x '(\.venv|venv|node_modules)' \
            . && echo "Python syntax OK"

      - name: Python correctness (pyflakes)
        run: |
          mapfile -t files < <(git ls-files '*.py')
          if [ ${#files[@]} -eq 0 ]; then
            echo "No Python files tracked yet - nothing to check."
            exit 0
          fi
          printf 'Checking %d Python file(s)\n' "${#files[@]}"
          python -m pyflakes "${files[@]}"
          echo "pyflakes OK"

      - name: YAML syntax
        run: |
          mapfile -t files < <(git ls-files '*.yml' '*.yaml')
          if [ ${#files[@]} -eq 0 ]; then
            echo "No YAML files tracked yet - nothing to check."
            exit 0
          fi
          python - "${files[@]}" <<'PY'
          import sys, yaml
          failed = False
          for path in sys.argv[1:]:
              try:
                  with open(path, encoding="utf-8") as fh:
                      list(yaml.safe_load_all(fh))
                  print(f"  ok   {path}")
              except Exception as exc:
                  print(f"  FAIL {path}: {exc}")
                  failed = True
          sys.exit(1 if failed else 0)
          PY

      - name: Shell script syntax
        run: |
          mapfile -t files < <(git ls-files '*.sh')
          if [ ${#files[@]} -eq 0 ]; then
            echo "No shell scripts tracked yet - nothing to check."
            exit 0
          fi
          for f in "${files[@]}"; do
            bash -n "$f" && echo "  ok   $f"
          done

      - name: Container scripts must not have CRLF endings
        run: |
          # The PostgreSQL initdb script is executed inside the container and
          # fails outright with CRLF, which a Windows checkout can introduce.
          fail=0
          while IFS= read -r f; do
            if grep -qU $'\r' "$f"; then
              echo "  FAIL $f contains CRLF line endings"
              fail=1
            else
              echo "  ok   $f"
            fi
          done < <(git ls-files '*.sh')
          exit $fail

  # ---------------------------------------------------------------------
  # The real test for banking/: stand up Fineract + PostgreSQL and run the
  # Phase 2 verification against them. This is what stops banking/ changes
  # from being merged on style checks alone.
  #
  # banking/ arrives on develop via the Phase 2 PR. Until that merges, this
  # job reports itself skipped rather than failing branches that legitimately
  # do not contain the module yet.
  # ---------------------------------------------------------------------
  banking-verification:
    name: Banking workload verification
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Detect banking module
        id: detect
        run: |
          if [ -f banking/docker-compose.yml ] && [ -f banking/verify/verify_workload.py ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
            echo "banking/ present - verification will run."
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::banking/ is not present on this branch; skipping workload verification."
          fi

      - uses: actions/setup-python@v5
        if: steps.detect.outputs.present == 'true'
        with:
          python-version: "3.11"

      - name: Install workload generator dependencies
        if: steps.detect.outputs.present == 'true'
        run: python -m pip install --quiet -r banking/workload/requirements.txt

      - name: Create local configuration
        if: steps.detect.outputs.present == 'true'
        working-directory: banking
        run: |
          cp .env.example .env
          echo "Configuration created from committed template."

      - name: Start Fineract and PostgreSQL
        if: steps.detect.outputs.present == 'true'
        working-directory: banking
        run: |
          docker compose up -d
          docker compose ps

      - name: Run Phase 2 verification
        if: steps.detect.outputs.present == 'true'
        working-directory: banking
        # Fineract runs Liquibase migrations on first boot; a CI runner is
        # slower than a developer machine, so the readiness wait is generous.
        run: python verify/verify_workload.py --wait-timeout 900

      - name: Container logs (on failure)
        if: failure() && steps.detect.outputs.present == 'true'
        working-directory: banking
        run: |
          echo "===== fineract ====="
          docker compose logs --tail 200 fineract || true
          echo "===== postgres ====="
          docker compose logs --tail 100 postgres || true

      - name: Tear down
        if: always() && steps.detect.outputs.present == 'true'
        working-directory: banking
        run: docker compose down -v || true
