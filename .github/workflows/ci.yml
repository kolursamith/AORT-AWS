name: CI

on:
  pull_request:
    branches: [developer, main]
  push:
    branches: [developer, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-and-tests:
    name: quality-and-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip setuptools
      - run: python -m pip install -e '.[dev]'
      - run: ruff format --check .
      - run: ruff check .
      - name: Verify generated contracts are current
        run: |
          python -m contracts.v1.generate_schemas
          git diff --exit-code -- contracts/v1/*.schema.json
      - run: pytest
