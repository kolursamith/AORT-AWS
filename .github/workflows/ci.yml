name: CI

on:
  pull_request:
    branches: [developer, main]
  push:
    branches: [developer, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-and-tests:
    name: quality-and-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      # Track B ledger/integration tests need PostgreSQL (they fail rather than skip when
      # AORTS_REQUIRE_DB=1). Throwaway CI-only credentials, not a secret.
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: aorts
          POSTGRES_PASSWORD: aorts-ci-only
          POSTGRES_DB: aorts
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U aorts" --health-interval 5s
          --health-timeout 5s --health-retries 20
    env:
      AORTS_TEST_DATABASE_URL: postgresql+psycopg://aorts:aorts-ci-only@127.0.0.1:5432/aorts_test
      AORTS_REQUIRE_DB: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip setuptools
      - run: python -m pip install -e '.[dev]'
      - run: ruff format --check .
      - run: ruff check .
      - name: Verify generated contracts are current
        run: |
          python -m contracts.v1.generate_schemas
          git diff --exit-code -- contracts/v1/*.schema.json
      - run: pytest
