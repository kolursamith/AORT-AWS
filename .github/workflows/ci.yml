name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [develop, feature/**, fix/**]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository-validation:
    name: repository-validation
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate required repository structure
        shell: bash
        run: |
          set -euo pipefail

          required_dirs=(
            .github
            architecture
            datasets
            docs
            presentation
            results
            src
          )
          required_files=(
            README.md
            LICENSE
          )

          for path in "${required_dirs[@]}"; do
            if [ ! -e "$path" ]; then
              echo "Missing required path: $path"
              exit 1
            fi
          done

          for path in "${required_files[@]}"; do
            if [ ! -f "$path" ]; then
              echo "Missing required file: $path"
              exit 1
            fi
          done

          echo "Required repository structure is present."

      - name: Validate JSON contract files if present
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          contracts_dir = Path('contracts')
          if not contracts_dir.exists():
              print('No contracts/ directory found; skipping JSON validation.')
              raise SystemExit(0)

          json_files = sorted(contracts_dir.rglob('*.json'))
          if not json_files:
              print('No contract JSON files found in contracts/; skipping JSON validation.')
              raise SystemExit(0)

          for path in json_files:
              with path.open('r', encoding='utf-8') as handle:
                  json.load(handle)
              print(f'Valid JSON: {path}')
          PY

      - name: Validate workflow YAML syntax if present
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          try:
              import yaml
          except ModuleNotFoundError:
              raise SystemExit('PyYAML is not installed. Run: python3 -m pip install PyYAML')

          workflow_dir = Path('.github/workflows')
          if not workflow_dir.exists():
              print('No workflow directory found; skipping YAML validation.')
              raise SystemExit(0)

          files = sorted(workflow_dir.glob('*.yml')) + sorted(workflow_dir.glob('*.yaml'))
          if not files:
              print('No workflow YAML files found; skipping YAML validation.')
              raise SystemExit(0)

          for path in files:
              with path.open('r', encoding='utf-8') as handle:
                  yaml.safe_load(handle)
              print(f'Valid YAML: {path}')
          PY

      - name: Secret pattern scan (basic)
        shell: bash
        run: |
          set -euo pipefail

          if git grep -nE 'AKIA[0-9A-Z]{16}|aws_secret_access_key|BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY|-----BEGIN .*PRIVATE KEY-----|(?i)(aws_access_key_id|aws_secret_access_key)' -- . ':!*.md' ':!*.pdf' ':!*.docx' ':!*.png' ':!*.jpg' ':!*.jpeg' ':!*.gif' ':!*.svg' ':!*.lock' ':!*.yml' ':!*.yaml' 2>/dev/null; then
            echo 'Potential secret pattern detected in tracked files.'
            exit 1
          fi
          echo 'No obvious secret patterns found.'

      - name: Check for committed env or credential files
        shell: bash
        run: |
          set -euo pipefail
          if git ls-files | grep -E '(^|/)(\.env|\.env\.|credentials|.*credentials.*|.*\.pem$|.*\.key$|.*\.p12$|.*\.pfx$|.*\.crt$|.*\.jks$)' >/dev/null; then
            echo 'Environment or credential files must not be committed.'
            exit 1
          fi
          echo 'No .env or credential files tracked.'

      - name: Python syntax check (when present)
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import py_compile
          from pathlib import Path

          files = []
          for path in Path('.').rglob('*.py'):
              if any(part in {'__pycache__', '.venv', 'venv', 'node_modules', '.git'} for part in path.parts):
                  continue
              files.append(path)

          if not files:
              print('No Python files found; skipping syntax validation.')
              raise SystemExit(0)

          for path in sorted(files):
              py_compile.compile(str(path), doraise=True)
              print(f'Valid Python syntax: {path}')
          PY

      - name: Run tests (when present)
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -d tests ]; then
            echo 'No tests/ directory found; skipping test execution.'
            exit 0
          fi

          if ! find tests -type f \( -name 'test_*.py' -o -name '*_test.py' \) | grep -q .; then
            echo 'No Python tests found under tests/; skipping test execution.'
            exit 0
          fi

          python3 -m pip install --quiet pytest >/dev/null 2>&1 || true
          python3 -m pytest tests/ -q
