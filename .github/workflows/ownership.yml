name: Ownership

on:
  pull_request_target:
    branches: [developer, main]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: read

jobs:
  owned-paths:
    name: owned-paths
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out trusted policy from base branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: trusted-policy
          persist-credentials: false
      - name: Read all changed paths, including rename sources
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: >-
          gh api --paginate --slurp
          "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/files?per_page=100"
          --jq 'add | map({filename, previous_filename, status})'
          > changed-files.json
      - name: Enforce trusted ownership map
        env:
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: python trusted-policy/.github/scripts/check_ownership.py --author "$PR_AUTHOR" --files changed-files.json
