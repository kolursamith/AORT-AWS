[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aort-recovery"
version = "0.1.0"
description = "Recovery execution and measured RTO/RPO for the AORT banking stack"
requires-python = ">=3.10"
dependencies = ["requests>=2.31"]
# Also requires the local package infrastructure/injection (aort-injection),
# installed with `pip install -e infrastructure/injection`. It is not on an
# index, so it cannot be declared as a resolvable dependency here.

[project.optional-dependencies]
test = ["pytest==8.3.4", "jsonschema==4.23.0"]

[tool.setuptools.packages.find]
include = ["aort_recovery*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: runs a real experiment against the stack (use --live)"]
