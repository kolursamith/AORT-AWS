[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aort-injection"
version = "0.1.0"
description = "Controlled, reversible failure injection for the AORT banking stack"
requires-python = ">=3.10"

[project.optional-dependencies]
test = ["pytest==8.3.4", "jsonschema==4.23.0", "requests>=2.31"]

[tool.setuptools.packages.find]
include = ["aort_injection*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live: injects into the running stack (run with --live)",
]
