[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aort-backup"
version = "0.1.0"
description = "Ledger-database backup state and restore for the AORT banking foundation"
requires-python = ">=3.10"

[project.optional-dependencies]
test = ["pytest==8.3.4"]

[tool.setuptools.packages.find]
include = ["aort_backup*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live: requires the running banking stack (run with --live)",
]
